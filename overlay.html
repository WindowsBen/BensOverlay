<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YaCoFo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="chat-container"></div>
    <div id="mod-anim-overlay"></div>
    <div id="poll-overlay"></div>
    <div id="prediction-overlay"></div>
    <div id="hype-train-overlay"></div>
    <!-- Shown when the Twitch token is expired, so the streamer can see it in OBS -->
    <div id="token-error-strip" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#c0392b;color:#fff;font-family:sans-serif;font-size:13px;font-weight:600;padding:8px 12px;z-index:9999;text-align:center;">
        ⚠ YACOFO: Twitch token expired — go to <u>yacofo.chat</u>, re-authenticate, then <strong>replace this browser source URL</strong> with the new one shown on the page.
    </div>

    <!-- Vendor -->
    <script src="tmi.min.js"></script>

    <!-- Foundation -->
    <script src="src/config.js"></script>
    <script src="src/utils.js"></script>

    <!-- Shared 7TV WebSocket -->
    <script src="src/seventv-ws.js"></script>

    <!-- Emotes -->
    <script src="src/emotes/emoteMap.js"></script>
    <script src="src/emotes/bttv.js"></script>
    <script src="src/emotes/ffz.js"></script>
    <script src="src/emotes/seventv.js"></script>

    <!-- Badges -->
    <script src="src/badges/badgeMap.js"></script>
    <script src="src/badges/twitch.js"></script>
    <script src="src/badges/ffz.js"></script>
    <script src="src/badges/chatterino.js"></script>
    <script src="src/badges/seventv.js"></script>

    <!-- UI -->
    <script src="src/ui/toasts.js"></script>
    <script src="src/ui/paints.js"></script>

    <!-- Chat -->
    <script src="src/chat/parser.js"></script>
    <script src="src/emotes/cheermotes.js"></script>
    <script src="src/chat/renderer.js"></script>
    <script src="src/chat/events.js"></script>
    <script src="src/chat/redemptions.js"></script>
    <script src="src/chat/moderation.js"></script>

    <!-- Entry point -->
    <script src="src/ui/mod-animations.js"></script>
    <script src="src/ui/poll.js"></script>
    <script src="src/ui/prediction.js"></script>
    <script src="src/ui/hype-train.js"></script>
    <script src="src/pubsub.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
